# DSLV-ZPDI: Kernel tuning for dedicated Tier 1 SDR pipeline node.
# Install to: /etc/sysctl.d/99-dslv-zpdi.conf

# Minimize swap thrashing — pipeline buffers stay in RAM
vm.swappiness=10
vm.dirty_ratio=20
vm.dirty_background_ratio=5
vm.vfs_cache_pressure=50

# Network: larger buffers for SDR data path (IIO over USB/IP)
net.core.rmem_max=16777216
net.core.wmem_max=16777216
