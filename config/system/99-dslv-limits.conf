# DSLV-ZPDI: PAM resource limits for the alphapi service user.
# Install to: /etc/security/limits.d/99-dslv.conf

# Allow unlimited memory locking (required for SDR ring buffer mlock)
alphapi hard memlock unlimited
alphapi soft memlock unlimited

# Allow real-time scheduling priority up to 99 (SCHED_FIFO/SCHED_RR)
alphapi hard rtprio 99
alphapi soft rtprio 99

# Allow maximum nice elevation for pipeline processes
alphapi hard nice -20
alphapi soft nice -20
