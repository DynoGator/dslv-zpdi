# DSLV-ZPDI: Systemd service priority drop-in.
# Install to: /etc/systemd/system/dslv-zpdi.service.d/dslv-priority.conf
# (and similarly for dslv-zpdi-tuning, dslv-zpdi-preflight, dslv-zpdi-webdash)

[Service]
# Elevated scheduling priority over non-critical system processes
Nice=-10
# I/O priority: best-effort class, priority 2 (higher than default 4)
IOSchedulingClass=best-effort
IOSchedulingPriority=2
# Pin pipeline to cores 1-3, leaving core 0 for OS/GUI responsiveness
CPUAffinity=1 2 3
# Allow the pipeline to mlock() buffers without limit (SDR ring buffers)
LimitMEMLOCK=infinity
