name: Docker
on: [push, pull_request]
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: |
          docker build -t dslv-zpdi:test .
          docker run --rm dslv-zpdi:test python -c "
import sys, pathlib
print('Docker python', sys.version)
print('pyproject present:', pathlib.Path('pyproject.toml').exists())
import tomllib
data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
print('version:', data.get('project',{}).get('version'))
" 
