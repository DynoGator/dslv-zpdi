name: CI Validation

on:
  push:
    branches: [ main, "feat/*", "mobile-*", "phase-*" ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install package (editable + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/ tests/ --output-format=github
      - name: Ruff format check
        run: ruff format --check src/ tests/
      - name: Mypy type check
        run: mypy src/ --ignore-missing-imports || true
      - name: Run orphan checker (SPEC compliance)
        run: python tools/orphan_checker.py
      - name: Run repo guard (git hygiene, structure)
        run: python tools/repo_guard.py
      - name: Run version sync check (pyproject vs __version__)
        run: python tools/check_version_sync.py
      - name: Pytest (full suite)
        run: PYTHONPATH=src pytest tests/ -v --tb=short
      - name: Validate pyproject / build
        run: python -c "
import tomllib, pathlib, subprocess, sys
data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
print('pyproject.toml valid, version:', data.get('project',{}).get('version'))
subprocess.check_call([sys.executable, '-m', 'pip', 'install', '-e', '.[dev]'])
print('Editable install OK')
"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -e ".[dev]" pip-audit
      - name: pip-audit (basic)
        run: pip-audit --desc || true
      - name: Dependency review (on PR)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (no push)
        run: |
          docker build -t dslv-zpdi:test .
          docker run --rm dslv-zpdi:test python -c "import sys; print('Docker python', sys.version)" || true

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: zricethezav/gitleaks-action@master
